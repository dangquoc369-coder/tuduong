<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#194744" />
      <stop offset="70%" stop-color="#0a2120" />
      <stop offset="100%" stop-color="#051413" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2c2" />
      <stop offset="40%" stop-color="#dfb15b" />
      <stop offset="100%" stop-color="#aa7928" />
    </linearGradient>
    <linearGradient id="petalGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dfb15b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#faeed1" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="aura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.3" />

  <!-- Outer Prayer Beads Circle (108 dots representation) -->
  <g stroke="url(#goldGrad)" fill="none" opacity="0.4" stroke-width="2">
    <circle cx="256" cy="256" r="190" stroke-dasharray="4 12" />
  </g>

  <!-- Aura Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Sacred Lotus Center -->
  <g transform="translate(256, 265)" filter="url(#aura)">
    <!-- Base Lotus Petals (Back Left & Right) -->
    <path d="M 0,40 C -80,25 -140,-20 -110,-90 C -70,-80 -30,-20 0,40 Z" fill="url(#goldGrad)" opacity="0.65" />
    <path d="M 0,40 C 80,25 140,-20 110,-90 C 70,-80 30,-20 0,40 Z" fill="url(#goldGrad)" opacity="0.65" />

    <!-- Mid Lotus Petals -->
    <path d="M 0,40 C -65,10 -105,-40 -65,-120 C -35,-90 -10,-30 0,40 Z" fill="url(#petalGrad)" stroke="url(#goldGrad)" stroke-width="1.5" />
    <path d="M 0,40 C 65,10 105,-40 65,-120 C 35,-90 10,-30 0,40 Z" fill="url(#petalGrad)" stroke="url(#goldGrad)" stroke-width="1.5" />

    <!-- Central Majestic Lotus Bud / Flame -->
    <path d="M 0,40 C -35,-20 -40,-90 0,-150 C 40,-90 35,-20 0,40 Z" fill="url(#goldGrad)" />
    
    <!-- Inner Core Heart -->
    <circle cx="0" cy="-35" r="14" fill="#fffbe8" />
    <circle cx="0" cy="-35" r="7" fill="#dfb15b" />

    <!-- Lotus Water Ripples -->
    <path d="M -80,50 Q 0,65 80,50" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M -50,65 Q 0,75 50,65" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  </g>
</svg>
